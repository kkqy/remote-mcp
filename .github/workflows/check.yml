name: Linux 与 Windows 验证
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare workspace temporary directories
        shell: pwsh
        run: |
          $base = Join-Path $env:GITHUB_WORKSPACE '.tmp'
          $directories = @{TMPDIR='temp'; TMP='temp'; TEMP='temp'; GOCACHE='go-cache'; GOTMPDIR='go-tmp'; GOMODCACHE='go-mod-cache'}
          foreach ($entry in $directories.GetEnumerator()) {
            $directory = Join-Path $base $entry.Value
            New-Item -ItemType Directory -Force -Path $directory | Out-Null
            "$($entry.Key)=$directory" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          'PYTHONDONTWRITEBYTECODE=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build -o bin/ ./cmd/...
        env:
          CGO_ENABLED: '0'
      - run: python -m unittest discover -s scripts -p "test*smoke.py"
      - run: python scripts/test_release.py
      - run: python scripts/smoke.py --bin-dir bin
      - run: python scripts/smoke.py --bin-dir bin --no-token
      - run: python scripts/p0-smoke.py --bin-dir bin --report-file reports/p0-token.json
      - run: python scripts/p0-smoke.py --bin-dir bin --no-token --report-file reports/p0-anonymous.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-native-${{ matrix.os }}
          path: reports/p0-*.json
          if-no-files-found: ignore
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare workspace temporary directories
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tmp/temp" "$GITHUB_WORKSPACE/.tmp/go-cache" "$GITHUB_WORKSPACE/.tmp/go-tmp" "$GITHUB_WORKSPACE/.tmp/go-mod-cache"
          for variable in TMPDIR TMP TEMP; do echo "$variable=$GITHUB_WORKSPACE/.tmp/temp" >> "$GITHUB_ENV"; done
          echo "GOCACHE=$GITHUB_WORKSPACE/.tmp/go-cache" >> "$GITHUB_ENV"
          echo "GOTMPDIR=$GITHUB_WORKSPACE/.tmp/go-tmp" >> "$GITHUB_ENV"
          echo "GOMODCACHE=$GITHUB_WORKSPACE/.tmp/go-mod-cache" >> "$GITHUB_ENV"
          echo 'PYTHONDONTWRITEBYTECODE=1' >> "$GITHUB_ENV"
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: remote-mcp-binaries
          path: dist/
      - name: Package release assets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release.py package --tag "$RELEASE_TAG"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        with:
          name: remote-mcp-release
          path: .tmp/release/
          include-hidden-files: true
          if-no-files-found: error
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 准备容器验证临时目录
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tmp/temp"
          for variable in TMPDIR TMP TEMP; do echo "$variable=$GITHUB_WORKSPACE/.tmp/temp" >> "$GITHUB_ENV"; done
          echo 'PYTHONDONTWRITEBYTECODE=1' >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - name: 构建本机验证镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: remote-mcp:smoke
          cache-from: type=gha,scope=container
          cache-to: type=gha,mode=max,scope=container
      - name: 验证 Compose 和真实容器能力
        run: |
          docker compose config --quiet
          python3 scripts/docker-smoke.py --image remote-mcp:smoke
  publish-image:
    needs: [native, cross-build, container]
    if: >-
      github.event_name == 'push' &&
      (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: 生成镜像名称与标签
        id: image
        env:
          IMAGE_REPOSITORY: ${{ github.repository }}
          IMAGE_REF_TYPE: ${{ github.ref_type }}
          IMAGE_REF_NAME: ${{ github.ref_name }}
          IMAGE_SHA: ${{ github.sha }}
        run: |
          image="ghcr.io/${IMAGE_REPOSITORY,,}"
          tag=latest
          if [[ "$IMAGE_REF_TYPE" == tag ]]; then
            if [[ ! "$IMAGE_REF_NAME" =~ ^v[A-Za-z0-9][A-Za-z0-9._-]{0,62}$ ]]; then
              echo 'Invalid release tag' >&2
              exit 1
            fi
            tag="$IMAGE_REF_NAME"
          fi
          {
            echo 'tags<<TAGS'
            echo "$image:$tag"
            echo "$image:sha-$IMAGE_SHA"
            echo 'TAGS'
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 发布 Linux 双架构镜像
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=publish-image
          cache-to: type=gha,mode=max,scope=publish-image
  release:
    needs: [native, cross-build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Prepare workspace temporary directory
        run: |
          mkdir -p "$GITHUB_WORKSPACE/.tmp/temp"
          for variable in TMPDIR TMP TEMP; do echo "$variable=$GITHUB_WORKSPACE/.tmp/temp" >> "$GITHUB_ENV"; done
          echo 'PYTHONDONTWRITEBYTECODE=1' >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: remote-mcp-release
          path: .tmp/release/
      - name: Publish release after all validation jobs succeed
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/release.py publish --tag "$RELEASE_TAG" --repo "$RELEASE_REPOSITORY"
