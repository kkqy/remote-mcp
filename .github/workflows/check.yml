name: Linux 与 Windows 验证
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build -o bin/ ./cmd/...
        env:
          CGO_ENABLED: '0'
      - run: python -m unittest discover -s scripts -p "test*smoke.py"
      - run: python scripts/smoke.py --bin-dir bin
      - run: python scripts/smoke.py --bin-dir bin --no-token
      - run: python scripts/p0-smoke.py --bin-dir bin --report-file reports/p0-token.json
      - run: python scripts/p0-smoke.py --bin-dir bin --no-token --report-file reports/p0-anonymous.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p0-native-${{ matrix.os }}
          path: reports/p0-*.json
          if-no-files-found: ignore
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - run: bash scripts/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: remote-mcp-binaries
          path: dist/
