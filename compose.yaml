services:
  remote-mcp:
    image: ${REMOTE_MCP_IMAGE:-ghcr.io/kkqy/remote-mcp:latest}
    network_mode: host
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    user: "${REMOTE_MCP_UID:-10001}:${REMOTE_MCP_GID:-10001}"
    working_dir: /workspace
    environment:
      REMOTE_MCP_TOKEN: ${REMOTE_MCP_TOKEN:-}
    command: ["--listen", "${REMOTE_MCP_LISTEN:-0.0.0.0:8080}"]
    volumes:
      - type: bind
        source: ${REMOTE_MCP_DATA_DIR:-./data}
        target: /workspace
        bind:
          create_host_path: false
